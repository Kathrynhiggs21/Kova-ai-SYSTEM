name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

env:
  # Job name and this env var are picked up by Copilot agent infrastructure.
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: "ab.chatgpt.com"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
