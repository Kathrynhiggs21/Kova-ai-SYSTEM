name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-platform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kova-ai/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python Dependencies
        run: python3 -m pip install -r kova-ai/requirements.txt

      - name: Run Platform Verification
        run: |
          chmod +x verify_platform.sh
          ./verify_platform.sh

      - name: Validate Multi-Repo Config
        run: python3 scripts/validate_config.py

      - name: Run Python Unit Tests
        run: PYTHONPATH=kova-ai python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python App Modules
        run: python3 -m compileall -q kova-ai/app

      - name: Run Browser Export Tests
        run: |
          node --check site/app.js
          node --test tests/test_site_exports.js

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Core image from Railway repository-root context
        run: docker build --file kova-ai/Dockerfile --tag kova-core:ci .

      - name: Start isolated Core container
        run: |
          docker run --detach --name kova-core-smoke \
            --env PORT=8765 \
            --env POSTGRES_PASSWORD=ci-only-database-password \
            --env DATABASE_URL=postgresql://ci:ci@db.internal/kova \
            --env KOVA_OWNER_API_KEY=ci-only-owner-key \
            kova-core:ci

      - name: Verify health and owner boundary on configured port
        run: docker exec -i kova-core-smoke python - < scripts/smoke_core_container.py

      - name: Build and start the documented Compose source mount
        run: |
          cp kova-ai/.env.example kova-ai/.env
          chmod 644 kova-ai/.env
          docker compose -f kova-ai/docker-compose.yml build api
          docker compose -f kova-ai/docker-compose.yml run --detach --no-deps \
            --name kova-compose-smoke \
            --env PORT=8765 \
            --env DATABASE_URL=postgresql://ci:ci@db.internal/kova \
            --env KOVA_OWNER_API_KEY=ci-only-owner-key api

      - name: Verify Compose health with the source bind mount
        run: docker exec -i kova-compose-smoke python - < scripts/smoke_core_compose.py

      - name: Compose logs
        if: always()
        run: docker logs kova-compose-smoke || true

      - name: Stop Compose test container
        if: always()
        run: docker rm --force kova-compose-smoke || true

      - name: Container logs
        if: always()
        run: docker logs kova-core-smoke || true

      - name: Stop test container
        if: always()
        run: docker rm --force kova-core-smoke || true
