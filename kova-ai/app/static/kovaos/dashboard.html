<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOVA OS Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body { background: #060412; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .orb { position:fixed; border-radius:50%; filter:blur(110px); pointer-events:none; z-index:0; }
    .orb-1 { background:rgba(139,92,246,0.18); width:48vw; height:48vw; top:-18%; left:-12%; }
    .orb-2 { background:rgba(99,102,241,0.14); width:44vw; height:44vw; bottom:-12%; right:-8%; }
    .glass {
      background: rgba(15,10,35,0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(139,92,246,0.18);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .nav-link { color:rgba(203,213,225,0.75); font-size:0.875rem; font-weight:500; transition:color 0.2s; }
    .nav-link:hover { color:#c084fc; }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#4c1d95; border-radius:4px; }
    .dash-link {
      color: rgba(203,213,225,0.8);
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.2s;
    }
    .dash-link:hover, .dash-link.active {
      background: rgba(139,92,246,0.2);
      border-color: rgba(139,92,246,0.45);
      color: #c084fc;
    }
    .dot-live { width:8px; height:8px; background:#22c55e; border-radius:50%; box-shadow:0 0 0 2px rgba(34,197,94,0.3); animation:pulse 2s infinite; }
  </style>
</head>
<body class="text-slate-100 min-h-screen">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header class="sticky top-0 z-20 border-b border-white/5 bg-black/40 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center">
            <svg viewBox="0 0 24 24" fill="none" class="w-3.5 h-3.5 text-white" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
          </div>
          <span class="text-xs uppercase tracking-[0.2em] text-violet-300 font-bold">Kova OS</span>
        </a>
        <span class="text-slate-700">/</span>
        <h1 class="font-black text-lg sm:text-xl text-white">Dashboard</h1>
      </div>
      <button id="nav-toggle" class="sm:hidden glass w-9 h-9 rounded-lg flex items-center justify-center text-slate-300">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav id="nav" class="hidden sm:flex items-center gap-2 text-sm flex-wrap">
        <a href="/ask" class="nav-link px-3 py-1.5 rounded-lg border border-transparent hover:border-violet-500/30">Ask KOVA</a>
        <a href="/brain" class="nav-link px-3 py-1.5 rounded-lg border border-transparent hover:border-violet-500/30">My Brain</a>
        <a data-route="overview" href="/dashboard/overview" class="dash-link px-3 py-1.5 rounded-lg">Overview</a>
        <a data-route="integrations" href="/dashboard/integrations" class="dash-link px-3 py-1.5 rounded-lg">Integrations</a>
        <a data-route="devices" href="/dashboard/devices" class="dash-link px-3 py-1.5 rounded-lg">Devices</a>
        <a data-route="automation" href="/dashboard/automation" class="dash-link px-3 py-1.5 rounded-lg">Automation</a>
      </nav>
    </div>
    <nav id="mobile-nav" class="hidden px-4 pb-3 grid-cols-2 gap-2 text-sm">
      <a href="/ask" class="dash-link px-3 py-2 rounded-lg text-center">Ask KOVA</a>
      <a href="/brain" class="dash-link px-3 py-2 rounded-lg text-center">My Brain</a>
      <a data-route="overview" href="/dashboard/overview" class="dash-link px-3 py-2 rounded-lg text-center">Overview</a>
      <a data-route="integrations" href="/dashboard/integrations" class="dash-link px-3 py-2 rounded-lg text-center">Integrations</a>
      <a data-route="devices" href="/dashboard/devices" class="dash-link px-3 py-2 rounded-lg text-center">Devices</a>
      <a data-route="automation" href="/dashboard/automation" class="dash-link px-3 py-2 rounded-lg text-center">Automation</a>
    </nav>
  </header>

  <main class="relative z-10 max-w-7xl mx-auto px-4 py-6 sm:py-8">
    <section class="mb-5 glass rounded-2xl p-4 sm:p-5">
      <div class="flex items-center gap-2 mb-1">
        <div class="dot-live"></div>
        <p id="page-kicker" class="text-xs uppercase tracking-[0.2em] text-violet-300">Dashboard</p>
      </div>
      <h2 id="page-title" class="text-xl sm:text-2xl font-extrabold mt-1">Overview</h2>
      <p id="page-subtitle" class="text-sm sm:text-base text-slate-400 mt-2">KOVA command center telemetry and controls.</p>
    </section>

    <section id="cards" class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-5"></section>
  </main>

  <script src="/static/kovaos/dashboard.js"></script>
  <script>
    document.getElementById('nav-toggle').addEventListener('click', () => {
      const m = document.getElementById('mobile-nav');
      m.classList.toggle('hidden');
      m.classList.toggle('grid');
    });
  </script>
</body>
</html>
